ont-size:48px;line-height:1.02;margin:12px 0 12px;letter-spacing:-1px}.hero p,.case p,.case li{font-size:16px;line-height:1.55;color:#334155}.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;font-size:13px;font-weight:900}.steps{display:grid;gap:10px}.step{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.step .num{width:36px;height:36px;border-radius:12px;background:#eff6ff;color:#1d4ed8;display:grid;place-items:center;font-weight:1000}.step.done{background:#f0fdf4;border-color:#86efac}.progress{height:12px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan),var(--gold));transition:.25s}.hidden{display:none!important}.question{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.choice{text-align:left;background:#fff;color:#142033;border:1px solid #dbe3ef;box-shadow:none;min-height:82px}.choice.selected{outline:4px solid rgba(37,99,235,.14)}.choice.good{background:#dcfce7;border-color:#22c55e}.choice.bad{background:#fee2e2;border-color:#ef4444}.feedback{display:none;margin-top:16px;border-radius:18px;padding:16px;background:#f8fafc;border:1px solid var(--line)}.feedback.show{display:block}.feedback.good{background:#ecfdf5;border-color:#86efac}.feedback.bad{background:#fff1f2;border-color:#fecdd3}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.lock{opacity:.5;pointer-events:none}.unlock{border:2px solid #f59e0b;background:#fffbeb}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}.card h3{margin:0 0 8px}.final{display:grid;grid-template-columns:1fr 1fr;gap:
